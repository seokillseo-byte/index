services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../../.env.api
    environment:
      NODE_ENV: production
      PORT: 4000
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
    networks: [index-assist-infrastructure_data]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    depends_on:
      api: { condition: service_healthy }
    networks: [index-assist-infrastructure_data]
  customer:
    build:
      context: ../..
      dockerfile: apps/customer/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:3002:3002"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3002/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    depends_on:
      api: { condition: service_healthy }
    networks: [index-assist-infrastructure_data]
  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    depends_on:
      api: { condition: service_healthy }
    networks: [index-assist-infrastructure_data]
  crawler:
    build:
      context: ../..
      dockerfile: services/crawler/Dockerfile
    restart: unless-stopped
    env_file: ../../.env.crawler
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: url.ingestion
      KAFKA_GROUP_ID: index-assist-crawler-v1
      PORT: 8080
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    networks: [index-assist-infrastructure_data]
  outbox-relay:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: ../../.env.worker
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      postgres: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    networks: [index-assist-infrastructure_data]

  provider-worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    command: ["node","src/provider-jobs.mjs"]
    restart: unless-stopped
    env_file: ../../.env.provider-worker
    environment:
      KAFKA_BROKERS: redpanda:9092
      PROVIDER_KAFKA_TOPIC: provider.jobs
      PROVIDER_KAFKA_GROUP_ID: index-assist-provider-v1
    depends_on:
      postgres: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    networks: [index-assist-infrastructure_data]
networks:
  index-assist-infrastructure_data:
    external: true
