services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../../.env.api
    environment:
      NODE_ENV: production
      PORT: 4000
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [index-assist-infrastructure_data]
  crawler:
    build:
      context: ../..
      dockerfile: services/crawler/Dockerfile
    restart: unless-stopped
    env_file: ../../.env.crawler
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: url.ingestion
      KAFKA_GROUP_ID: index-assist-crawler-v1
      PORT: 8080
    depends_on:
      postgres: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    networks: [index-assist-infrastructure_data]
  outbox-relay:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: ../../.env.worker
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      postgres: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    networks: [index-assist-infrastructure_data]
networks:
  index-assist-infrastructure_data:
    external: true
