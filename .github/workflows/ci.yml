name: CI
on:
  pull_request:
  push:
    branches: [main, feature/provider-job-engine]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Validate Compose and Redpanda YAML syntax
        run: ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file) }' infra/docker/compose.infrastructure.yml infra/docker/compose.workloads.yml infra/redpanda/redpanda.yaml.example infra/redpanda/.bootstrap.yaml.example
      - run: pnpm --recursive --if-present typecheck
      - run: pnpm --recursive --if-present build
      - run: pnpm --recursive --if-present test
      - run: node --check apps/worker/src/kafka-config.mjs
      - run: node --check apps/worker/src/outbox-relay.mjs
      - run: node --check apps/worker/src/provider-jobs.mjs
      - run: node --check apps/worker/src/provider-job-benchmark.mjs
      - run: bash -n infra/postgres/backup.sh infra/postgres/restore.sh infra/postgres/tests/backup-restore-mock.sh
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: bash infra/postgres/tests/backup-restore-mock.sh
  crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: cd services/crawler && go mod tidy
      - run: cd services/crawler && go test -race ./...
      - run: cd services/crawler && go vet ./...
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: index_assist
          POSTGRES_USER: index_assist
          POSTGRES_PASSWORD: postgres-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U index_assist -d index_assist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap least-privilege roles
        env:
          POSTGRES_USER: index_assist
          POSTGRES_DB: index_assist
          APP_DB_PASSWORD: runtime-ci-password
          RELAY_DB_PASSWORD: relay-ci-password
          PGPASSWORD: postgres-ci-password
        run: bash infra/postgres/init/001-runtime-role.sh
      - name: Apply ordered migrations
        env:
          MIGRATION_DATABASE_URL: postgresql://index_assist:postgres-ci-password@127.0.0.1:5432/index_assist
          PGPASSWORD: postgres-ci-password
        run: bash infra/postgres/migrate.sh
      - name: Verify tenant isolation using the runtime role
        env:
          MIGRATION_DATABASE_URL: postgresql://index_assist:postgres-ci-password@127.0.0.1:5432/index_assist
          PGPASSWORD: postgres-ci-password
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/tenant_rls_runtime.sql
      - name: Verify MFA challenge lockout behavior
        env:
          MIGRATION_DATABASE_URL: postgresql://index_assist:postgres-ci-password@127.0.0.1:5432/index_assist
          PGPASSWORD: postgres-ci-password
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/mfa_challenge_attempt_limits.sql
      - name: Verify authentication token replay protection
        env:
          MIGRATION_DATABASE_URL: postgresql://index_assist:postgres-ci-password@127.0.0.1:5432/index_assist
          PGPASSWORD: postgres-ci-password
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/auth_token_replay.sql
      - name: Verify MFA recovery-code replay protection
        env:
          MIGRATION_DATABASE_URL: postgresql://index_assist:postgres-ci-password@127.0.0.1:5432/index_assist
          PGPASSWORD: postgres-ci-password
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/mfa_recovery_code_replay.sql
